# PokéDex Manager — levanta todo con: docker compose up
# (la web también puede correrse con `npm run dev` fuera de Docker durante desarrollo)
services:
  web:
    build: ./web
    ports: ["3000:3000"]
    env_file: ./web/.env.local
    depends_on: [ai-service]

  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
    env_file: ./ai-service/.env
